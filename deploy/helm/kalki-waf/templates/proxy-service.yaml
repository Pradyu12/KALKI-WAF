apiVersion: v1
kind: Service
metadata:
  name: {{ include "kalki-waf.name" . }}-proxy
  labels:
    {{- include "kalki-waf.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  {{- with .Values.proxy.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.proxy.service.type }}
  ports:
    - port: {{ .Values.proxy.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kalki-waf.proxy.selectorLabels" . | nindent 4 }}
