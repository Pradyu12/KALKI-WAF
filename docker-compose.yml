services:
  # ─── Go Proxy (WAF engine, hot path) ──────────────────────────────
  proxy:
    build: ./proxy
    image: ${PROXY_IMAGE:-}
    restart: always
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - PROXY_PORT=8080
      - UPSTREAM_SERVER_URL=http://api:8000
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - GEOIP_DB_PATH=/data/GeoLite2-Country.mmdb
      - RATE_LIMIT_THRESHOLD=${RATE_LIMIT_THRESHOLD:-50}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-10}
      - BLOCKED_COUNTRIES=${BLOCKED_COUNTRIES:-}
      - DEBUG=${DEBUG:-false}
      # Datadog / OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://datadog-agent:4317
    depends_on:
      - api
      - redis
      - datadog-agent
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "kalki-waf-proxy"}]'
      com.datadoghq.tags.env: ${DD_ENV:-production}
      com.datadoghq.tags.service: kalki-waf-proxy

  # ─── Python API (management + dashboard + SIEM) ───────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ${API_IMAGE:-}
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - DB_PATH=/data/security_gateway.db
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CREDENTIALS_PATH=/app/firebase-credentials.json
      - UPSTREAM_SERVER_URL=http://upstream:8080
      - ENV=${ENV:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - upstream
      - datadog-agent
    volumes:
      - ./api/firebase-credentials.json:/app/firebase-credentials.json:ro
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "kalki-waf-api"}]'
      com.datadoghq.tags.env: ${DD_ENV:-production}
      com.datadoghq.tags.service: kalki-waf-api

  # ─── Redis (rate limiting + caching) ──────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ─── Upstream Test Server ──────────────────────────────────────────
  upstream:
    build:
      context: ./api/upstream
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8081:8080"
    environment:
      - PORT=8080

  # ─── Datadog Agent (monitoring) ───────────────────────────────────
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    restart: always
    environment:
      - DD_API_KEY=${DD_API_KEY:-}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_HOSTNAME=kalki-waf
      - DD_ENV=${DD_ENV:-production}
      - DD_SERVICE=kalki-waf
      - DD_VERSION=${CI_COMMIT_SHORT_SHA:-latest}
      - DD_TAGS=team:security app:kalki-waf service:kalki-waf
      - DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENABLED=true
      - DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENABLED=true
      - DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT=0.0.0.0:4318
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE=name:datadog-agent
      - DD_AC_EXCLUDE=name:datadog-agent
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_HEALTH_PORT=5555
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - ./datadog/conf.d:/etc/datadog-agent/conf.d:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "agent", "healthcheck"]
      interval: 30s
      retries: 3
      start_period: 20s

volumes:
  redis_data:
