<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Shield shape -->
  <path d="M100 10 L180 50 L180 110 Q180 160 100 190 Q20 160 20 110 L20 50 Z"
        fill="url(#bg)" stroke="url(#glow)" stroke-width="4" filter="url(#shadow)"/>
  <!-- K letter -->
  <text x="100" y="135" font-family="Arial,Helvetica,sans-serif" font-weight="800"
        font-size="90" text-anchor="middle" fill="white" letter-spacing="-4">K</text>
  <!-- Accent line -->
  <line x1="50" y1="170" x2="150" y2="170" stroke="#a855f7" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
